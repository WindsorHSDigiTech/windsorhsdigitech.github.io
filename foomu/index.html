<link href="main.css" rel="stylesheet">
<h1>☯️ FOOMU ☯️</h1>
<h2>Welcome to Mr Forwood's house of plastic</h2>
<form action="https://myfirebase.com.au" method="POST">
<input type="hidden" name="team" value="teamSim">
<label for="nickname">Enter a Nickname for your order:</label>
<input type="text" id="nickname" name="nickname" required>
<hr>
<div class="product">
  <h2>Butterfly comb</h2>
  <p>Flick yourself some style</p>
  <img src="purplebutterflycomb.jpeg">
  <p>$3.00</p>
  <label for="quantity1">Quantity:</label>
  <input type="number" id="quantity1" name="quantity1" value="1" min="1" max="10" required>
  <button type="submit" name="product" value="Butterfly comb">Buy</button>
</div>
<div class="product">
  <h2>Little Shoes</h2>
  <p>Everyone needs a pair</p>
  <img src="littleshoes.jpeg">
  <p>$1.50</p>
  <label for="quantity2">Quantity:</label>
  <input type="number" id="quantity2" name="quantity2" value="1" min="1" max="10" required>
  <button type="submit" name="product" value="Little Shoes">Buy</button>
</div>
<div class="product">
  <h2>Desk pencil box</h2>
  <p>Ultimate desk tidy</p>
  <img src="pencilbox.jpeg">
  <p>$2.50</p>
  <label for="quantity3">Quantity:</label>
  <input type="number" id="quantity3" name="quantity3" value="1" min="1" max="10" required>
  <button type="submit" name="product" value="Desk pencil box">Buy</button>
</div>
</form>
