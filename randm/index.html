<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R&M | Shop</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1a0033;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #8000ff;
        }
        h1 {
            color: #b366ff;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            display: flex;
            gap: 20px;
        }
        .products {
            flex: 2;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .product-card {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s;
        }
        .product-card:hover {
            border-color: #8000ff;
            transform: translateY(-5px);
        }
        .product-title {
            color: #b366ff;
            font-size: 1.2em;
            margin: 10px 0;
        }
        .price {
            font-weight: bold;
            margin-bottom: 15px;
        }
        button {
            background-color: #8000ff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #9933ff;
        }
        .cart-panel {
            flex: 1;
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 8px;
            height: fit-content;
        }
    </style>
</head>
<body>

<header>
    <h1>R&M Store</h1>
</header>

<div class="container">
    <!-- Products -->
    <div class="products">
        <div class="product-card">
            <div class="product-title">Premium Item 1</div>
            <div class="price">$49.99</div>
            <button onclick="addToCart('Premium Item 1', 49.99)">Add to Cart</button>
        </div>
        <div class="product-card">
            <div class="product-title">Premium Item 2</div>
            <div class="price">$79.99</div>
            <button onclick="addToCart('Premium Item 2', 79.99)">Add to Cart</button>
        </div>
    </div>

    <!-- Checkout Panel (Simulation) -->
    <div class="cart-panel">
        <h2>Your Cart</h2>
        <div id="cart-items">Empty</div>
        <p>Total: <span id="cart-total">$0.00</span></p>
        <hr style="border-color: #333;">
        <h3>Mock Checkout</h3>
        <input type="text" placeholder="Card Number (Simulation Only)" style="width:90%; padding:8px; margin-bottom:10px; background:#000; color:#fff; border:1px solid #444;"><br>
        <button onclick="simulateCheckout()">Place Order (Demo)</button>
    </div>
</div>

<script>
    let cart = [];
    let total = 0;

    function addToCart(name, price) {
        cart.push({name, price});
        total += price;
        updateCartDisplay();
    }

    function updateCartDisplay() {
        const itemsDiv = document.getElementById('cart-items');
        if(cart.length === 0) {
            itemsDiv.innerHTML = 'Empty';
        } else {
            itemsDiv.innerHTML = cart.map(item => `<div>${item.name} - $${item.price}</div>`).join('');
        }
        document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
    }

    function simulateCheckout() {
        if(cart.length === 0) {
            alert('Cart is empty');
            return;
        }
        // In a real application, data is sent securely to a backend database here.
        alert('Order placed successfully (Simulation)');
        cart = [];
        total = 0;
        updateCartDisplay();
    }
</script>

</body>
</html>
